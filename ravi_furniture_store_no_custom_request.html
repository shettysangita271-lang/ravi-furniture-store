      if(isOwner()){
        await Promise.all([
          FS().collection('appState').doc('cats'+suffix).set({value:S.cats,updatedAt:Date.now(),updatedBy:AUTH().currentUser.uid,restaurantId:RESTAURANT_ID}),
          FS().collection('appState').doc('products'+suffix).set({value:S.products,updatedAt:Date.now(),updatedBy:AUTH().currentUser.uid,restaurantId:RESTAURANT_ID})
        ]);
      }
    }
    DB.set('cats',S.cats);DB.set('products',S.products);
  }catch(e){console.warn('Catalog load failed',e)}
}

async function loadRestaurants(){
  // Single-store setup: customers always shop from Ravi Furniture Store.
  RESTAURANTS=[{id:DEFAULT_RESTAURANT_ID,name:'Ravi Furniture Store',description:'Quality furniture for every home',address:'Nepal',phone:'+977 982-452-6206',deliveryAvailable:true,pickupAvailable:true,active:true,ownerEmail:''}];
  RESTAURANT_ID=DEFAULT_RESTAURANT_ID;
  localStorage.setItem('nof_selected_restaurant',DEFAULT_RESTAURANT_ID);
  render();
}

function chooseRestaurant(id){
  const r=RESTAURANTS.find(x=>x.id===id);if(!r)return;
  if(Object.keys(S.cart||{}).length&&id!==RESTAURANT_ID&&!confirm('Changing restaurant will clear your current cart. Continue?'))return;
  if(id!==RESTAURANT_ID){S.cart={};DB.set('cart',S.cart);RESTAURANT_ID=id;localStorage.setItem('nof_selected_restaurant',id);S.cat='All';
    seed();render();loadCloudCatalog().then(()=>{syncCatalog();render()});
  }else render();
}

function syncCatalog(){
  if(!FIREBASE_ONLINE)return;
  catalogListeners.forEach(unsub=>{try{unsub()}catch(e){}});catalogListeners=[];
  ['cats','products'].forEach(k=>{
    const suffix=RESTAURANT_ID===DEFAULT_RESTAURANT_ID?'':'__'+RESTAURANT_ID;
    const unsub=FS().collection('appState').doc(k+suffix).onSnapshot(s=>{
      if(!s.exists)return; const v=s.data().value;if(v===undefined)return;
      if(k==='products'&&Array.isArray(v)&&v.some(p=>/momo|chowmein|thukpa|sekuwa|milk tea|rasgulla|samosa/i.test(String(p.name||'')))){seed();DB.set('cats',S.cats);DB.set('products',S.products);if(isOwner())FS().collection('appState').doc('products').set({value:S.products,updatedAt:Date.now(),updatedBy:AUTH().currentUser.uid,restaurantId:RESTAURANT_ID}).catch(e=>console.warn('Furniture menu migration failed',e));if(!$('#layer').innerHTML)render();return;}
      DB.set(k,v);if(typeof S!=='undefined'&&S.products){S[k]=v;if(!$('#layer').innerHTML&&!['checkout'].includes(S.view))render();}
    },e=>console.warn('Catalog listener failed',k,e));catalogListeners.push(unsub);
  });
}

async function cloudCreateOrder(o){
  const u=await ensureCustomerAuth();
  if(!u)throw new Error('Customer authentication unavailable');
  o.customerUid=u.uid;o.restaurantId=RESTAURANT_ID;
  await FS().collection('orders').doc(o.id).set(o);
  return o;
}

function watchCustomerOrders(){
  if(!FIREBASE_ONLINE)return;
  ensureCustomerAuth().then(u=>{if(!u)return;
    FS().collection('orders').where('customerUid','==',u.uid).where('restaurantId','==',RESTAURANT_ID).onSnapshot(s=>{
      const arr=s.docs.map(d=>d.data()).sort((a,b)=>(b.created||0)-(a.created||0));
      S.orders=arr;DB.set('orders',arr);
      arr.forEach(o=>{if(!S.my.includes(o.id))S.my.push(o.id)});DB.set('my',S.my);
      if(!$('#layer').innerHTML&&!['checkout'].includes(S.view))render();
    },e=>console.warn('Customer order listener failed',e));
  });
}

function watchAdminOrders(){
  if(!isOwner())return;
  FS().collection('orders').where('restaurantId','==',RESTAURANT_ID).onSnapshot(s=>{
    S.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));
    DB.set('orders',S.orders);
    if(S.view==='admin'&&!$('#layer').innerHTML)render();
  },e=>console.warn('Admin order listener failed',e));
}

async function saveOrderStatus(id,status){
  if(!isOwner())throw new Error('Owner authentication required');
  const ref=FS().collection('orders').doc(id);
  const snap=await ref.get();if(!snap.exists)throw new Error('Order not found');
  const o=snap.data();const log=Array.isArray(o.log)?o.log.slice():[];log.push({s:status,t:Date.now()});
  await ref.update({status,log});
}

function seed(){
  S.cats=SEED_CATS.slice();
  S.products=SEED_FOODS.map((f,i)=>({id:'ravi'+(i+1),name:f[0],cat:f[1],price:f[2],emoji:f[3],desc:f[4],originalPrice:f[5],discount:f[6],avail:true,img:RAVI_PRODUCT_PHOTOS[i]||''}));
}
function load(){
  const catalogVersion=localStorage.getItem('ghf_catalog_version');
  if(catalogVersion!=='5'){
    seed();DB.set('cats',S.cats);DB.set('products',S.products);
    localStorage.setItem('ghf_catalog_version','5');
  }else{
    S.cats=DB.get('cats',null);S.products=DB.get('products',null);
    const looksLikeOldFoodMenu=Array.isArray(S.products)&&S.products.some(p=>/momo|chowmein|thukpa|sekuwa|milk tea|rasgulla|samosa/i.test(String(p.name||'')));
    if(!S.cats||!S.products||looksLikeOldFoodMenu){seed();DB.set('cats',S.cats);DB.set('products',S.products)}
  }
  S.cart=DB.get('cart',{});S.wish=DB.get('wish',[]);S.orders=DB.get('orders',[]);
  S.customer=DB.get('customer',{name:'',phone:'',address:''});S.deliveryLocation=DB.get('deliveryLocation',null);S.customers=DB.get('customers',[]);
  S.my=DB.get('my',[]);S.fulfillmentMode='delivery';S.admin={user:'Store owner',pass:''};
  S.adminIn=localStorage.getItem('nof_owner_login')==='1';
  S.view='home';S.cat='All';S.q='';S.atab='dash';S.of='All';S.err={};S.menuSort=DB.get('menuSort','recommended');S.availableOnly=DB.get('availableOnly',false);S.recentSearches=DB.get('recentSearches',[]);S.recentlyViewed=DB.get('recentlyViewed',[]);S.orderSearch=DB.get('orderSearch','');
}
const save=k=>{
  const ok=DB.set(k,S[k]);
  if(ok&&FIREBASE_ONLINE&&FS()&&isOwner()&&['products','cats'].includes(k)){
    FS().collection('appState').doc(k+(RESTAURANT_ID===DEFAULT_RESTAURANT_ID?'':'__'+RESTAURANT_ID)).set({value:S[k],updatedAt:Date.now(),updatedBy:AUTH().currentUser.uid,restaurantId:RESTAURANT_ID})
      .catch(e=>{console.error('Catalog cloud save failed',k,e);toast('Saved on this device, but cloud sync failed: '+(e.code||e.message));});
  }
  return ok;
};

function defaultProductPhoto(f){
 const n=String(f.name||'').trim().toLowerCase(), c=String(f.cat||'').toLowerCase();
 const localKey=RAVI_ITEM_PHOTO_KEYS[n];
 if(localKey&&RAVI_APPROVED_PHOTOS[localKey]) return RAVI_APPROVED_PHOTOS[localKey];
 const id=PRODUCT_PHOTOS[n]||(/sofa|recliner/.test(n)?PHOTO_FALLBACKS.sofa:/bed/.test(n)?PHOTO_FALLBACKS.bed:/dining|table|desk/.test(n)?PHOTO_FALLBACKS.dining:/chair/.test(n)?PHOTO_FALLBACKS.chair:/wardrobe|shelf|storage|rack|cabinet|bookshelf/.test(n)||c==='storage'?PHOTO_FALLBACKS.storage:c==='decor'?PHOTO_FALLBACKS.decor:PHOTO_FALLBACKS.sofa);

}
function vis(f){
 const c=COLORS[(String(f.id||'f1').charCodeAt(String(f.id||'f1').length-1)||0)%COLORS.length];
 const photo=f.img||f.imageUrl||defaultProductPhoto(f);
 return {bg:'background:'+c,img:photo?`<img src="${esc(photo)}" alt="${esc(f.name||'Furniture photo')}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.parentElement.classList.add('photo-fallback')">`:''};
}

/* ---------- Firebase auth + order sync ---------- */
async function ensureCustomerAuth(){
  if(!FIREBASE_ONLINE||!AUTH())return null;
  const current=AUTH().currentUser;
  // A signed-in owner is still a valid Firebase user for creating an order.
  // The previous check returned null for the owner account and blocked checkout.
  if(current)return current;
  try{const r=await AUTH().signInAnonymously();return r.user;}
  catch(e){console.error('Guest customer sign-in failed',e);const code=e&&e.code?e.code:'unknown';if(code==='auth/operation-not-allowed')throw new Error('Online ordering is temporarily unavailable. Please contact the store at +977 982-452-6206.');if(code==='auth/unauthorized-domain')throw new Error('This website is not yet authorized for online ordering. Please contact the store at +977 982-452-6206.');if(code==='auth/network-request-failed')throw new Error('Could not connect to the online service. Check your internet and try again.');if(code==='auth/invalid-api-key')throw new Error('Online ordering is temporarily unavailable. Please contact the store.');throw new Error('Online ordering could not connect ('+code+'): '+(e&&e.message?e.message:'check Firebase settings and internet.'));}
}
function isSuperAdmin(){return !!(FIREBASE_ONLINE&&AUTH()&&AUTH().currentUser&&AUTH().currentUser.uid===OWNER_UID)}
function isOwner(){return isSuperAdmin()||!!(S&&S.ownerRestaurantId&&AUTH()&&AUTH().currentUser&&S.ownerUid===AUTH().currentUser.uid)}
async function cloudCreateOrder(o){
  if(!FIREBASE_ONLINE||!FS())return false;
  const u=await ensureCustomerAuth();
  if(!u)throw new Error('Your online session could not start. Please try again.');
  o.customerUid=u.uid;o.restaurantId=RESTAURANT_ID;
  await FS().collection('orders').doc(o.id).set(o);
  return true;
}

function notifyNewOrder(o){
  const customer=(o&&o.customer&&o.customer.name)||'Customer';
  const message='New order from '+customer+' · '+(o&&o.id?o.id:'');
  toast(message);
  try{
    if('Notification' in window && Notification.permission==='granted'){
      const n=new Notification('Ravi Furniture Store — New Order',{body:message,tag:'order-'+(o&&o.id||Date.now()),icon:'./favicon.ico'});
      n.onclick=()=>{window.focus();S.view='admin';render();n.close();};
    }
  }catch(e){console.warn('Desktop notification unavailable',e);}
}
function requestOrderNotificationPermission(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission().catch(e=>console.warn('Notification permission not granted',e));
    }
  }catch(e){console.warn('Notification permission unavailable',e);}
}
function watchAdminOrders(){

  requestOrderNotificationPermission();
  try{if(adminOrdersUnsub)adminOrdersUnsub();}catch(e){}
  adminOrderFirstSnapshot=true;adminKnownOrderIds=new Set();
  const q=isSuperAdmin()?FS().collection('orders'):FS().collection('orders').where('restaurantId','==',S.ownerRestaurantId||RESTAURANT_ID);
  q.get().then(s=>{
    S.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));
    adminKnownOrderIds=new Set(S.orders.map(o=>o.id));
    DB.set('orders',S.orders);
    if(S.view==='admin')render();
  }).catch(e=>{
    console.error('Admin initial order load failed',e);
    if(S.view==='admin')toast('Cannot read orders: '+(e.code||e.message||'permission denied'));
  });
  adminOrdersUnsub=q.onSnapshot(s=>{
    const incoming=s.docs.map(d=>({id:d.id,...d.data()}));
    if(adminOrderFirstSnapshot){
      adminOrderFirstSnapshot=false;
      incoming.forEach(o=>adminKnownOrderIds.add(o.id));
    }else{
      s.docChanges().forEach(change=>{
        if(change.type==='added'){
          const o={id:change.doc.id,...change.doc.data()};
          if(!adminKnownOrderIds.has(o.id)){adminKnownOrderIds.add(o.id);notifyNewOrder(o);}
        }
      });
    }
    S.orders=incoming.sort((a,b)=>(b.created||0)-(a.created||0));
    DB.set('orders',S.orders);
    if(S.view==='admin'&&!$('#layer').innerHTML)render();
  },e=>{
    console.error('Admin order listener failed',e);
    if(S.view==='admin')toast('Live orders error: '+(e.code||e.message||'permission denied'));
  });
}
function watchCustomerOrders(){
  if(!FIREBASE_ONLINE||!AUTH())return;
  const u=AUTH().currentUser;if(!u)return;
  FS().collection('orders').where('customerUid','==',u.uid).where('restaurantId','==',RESTAURANT_ID).onSnapshot(s=>{
    const cloud=s.docs.map(d=>d.data()).sort((a,b)=>(b.created||0)-(a.created||0));
    // Replace the shared device cache, including when this user has no orders.
    S.orders=cloud;
    S.my=cloud.map(o=>o.id);
    try{localStorage.setItem('nof_orders',JSON.stringify(cloud));localStorage.setItem('nof_my',JSON.stringify(S.my));}catch(e){}
    if(['orders','done'].includes(S.view)&&!$('#layer').innerHTML)render();
  },e=>console.warn('Customer order listener failed',e));
}
async function saveOrderStatus(id,status){

}

function rnfiSupportAnswer(raw){const q=String(raw||'').toLowerCase();
  if(/track|status|pending|where.*order|order progress/.test(q)) return 'To track your furniture order, open Orders from the bottom menu. You can see its status and delivery progress there. If it does not appear, refresh the page and check again before placing another order.';
  if(/delivery|shipping|deliver|how long|when.*arrive/.test(q)) return 'For delivery, make sure your checkout address or Google Maps link is correct. Delivery timing can vary by location and item; the furniture owner can confirm the expected delivery date.';
  if(/pickup|collect|pick up/.test(q)) return 'If store pickup is enabled at checkout, select Store pickup. Otherwise choose home delivery and enter your address.';
  if(/price|cost|budget|discount|cheap|expensive/.test(q)) return 'Open a furniture product card to see its listed price. Use Find by budget or Check my budget to compare options. For bulk orders or a special quote, contact the furniture owner.';
  if(/photo|image|sofa|bed|table|chair|product|catalog|available/.test(q)) return 'Browse Home and tap a furniture item to see its details, price, availability and photos. Use the search and category filters to find a specific item.';
  if(/payment|cash|cod|pay|bank|online payment/.test(q)) return 'Checkout currently supports Cash on Delivery only. Pay the confirmed amount when your furniture is delivered. Never share your wallet PIN, banking PIN or OTP.';
  if(/address|location|map|gps|district/.test(q)) return 'At checkout, enter a clear delivery address or a valid Google Maps link. You can share GPS location if you are comfortable. Double-check your district and phone number before ordering.';
  if(/cancel|cancellation/.test(q)) return 'Open Orders and tap Request cancellation if your order is still Pending or Confirmed. The furniture owner must review the request; submitting it does not automatically cancel the order.';
  if(/return|refund|damaged|broken|wrong item|exchange/.test(q)) return 'If an item arrives damaged, incorrect or unsuitable, contact the furniture owner with your order ID, photos and a short description. Returns or refunds require store review and are not automatic.';
  if(/change.*order|edit.*order|wrong.*order|quantity/.test(q)) return 'Order details may not be editable after submission. Open Orders to check its status, then contact the furniture owner promptly with your order ID and requested change.';
  if(/invoice|receipt|bill|total/.test(q)) return 'Your order card shows the items and total. Keep your order ID as a reference. For a formal invoice or receipt, contact the furniture owner.';
  if(/measure|size|dimension|room|fit/.test(q)) return 'Measure the width, depth and height of the space, including doorways and stairways. Compare those measurements with the product dimensions before ordering; ask the furniture owner if dimensions are not listed.';
  if(/care|clean|polish|maintain|maintenance/.test(q)) return 'For furniture care, dust regularly with a soft cloth, clean spills promptly, avoid harsh chemicals and direct prolonged sunlight, and follow any care instructions supplied with the item.';
  if(/assembly|install|installation|assemble/.test(q)) return 'Please confirm assembly or installation availability with the furniture owner before ordering. Do not assume installation is included in the listed price.';

  if(/bulk|wholesale|multiple|custom|customize|customise/.test(q)) return 'For bulk quantities or custom furniture, share the item or design, measurements, quantity and preferred budget with the furniture owner to request a quote.';
  if(/wishlist|saved|favourite|favorite/.test(q)) return 'Tap the heart on a product to save it to Saved/Wishlist. Open Saved from the bottom menu to review your chosen furniture.';
  if(/cart|basket|checkout|place.*order/.test(q)) return 'Add furniture to your Cart, review quantities and total, then proceed to checkout. Enter your contact details and delivery information carefully before confirming the order.';
  if(/account|login|log in|register|create account|password/.test(q)) return 'Open Account to log in or create a customer account using your email and password. If you cannot sign in, check your email and password or use Firebase-enabled account recovery if available.';
  if(/human|owner|phone|contact|support|call|whatsapp/.test(q)) return 'Contact the furniture owner for personal assistance at +977 982-452-6206. Share your order ID when asking about an existing order.';
  if(/hello|hi|namaste|hey|good morning|good evening/.test(q)) return 'Namaste! Welcome to Ravi Furniture Store. I can help with order tracking, products, prices, delivery, payments, cancellations, returns, furniture care and more. What would you like to know?';
  if(/thank/.test(q)) return 'You are welcome! Thank you for choosing Ravi Furniture Store. If you need more help, ask me another question or contact the furniture owner.';
  return 'I can help with: order tracking, delivery, pickup, prices, product photos, payments, address, cancellations, returns, order changes, receipts, measurements, furniture care, assembly, warranty, bulk orders, wishlist, cart, account login and support. Ask me about any of these, or contact the furniture owner at +977 982-452-6206. I am an automated FAQ chatbot, not a live AI agent.';
}

function ownerCopyPendingSummary(){if(!isOwner())return toast('Staff login required.');const list=S.orders.filter(o=>['Pending','Confirmed','Preparing'].includes(String(o.status||'')));const t=list.map(o=>`${o.id} | ${o.status} | ${o.customer?.name||'Customer'} | ${o.customer?.phone||'No phone'} | Rs. ${o.total||0}`).join('\n');nofCopyText('PENDING / ACTIVE ORDERS\n'+(t||'No pending orders'),'Active order summary copied.');}
function ownerExportRevenueReport(){if(!isOwner())return toast('Staff login required.');const rows=[['Date','Order ID','Status','Payment','Total'],...S.orders.map(o=>[new Date(o.created||Date.now()).toISOString(),o.id,o.status||'',o.payment||'',Number(o.total||0)])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile('nepali-furniture-revenue-orders-report.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Order value report exported.');}
function ownerCopyCustomerContacts(){if(!isOwner())return toast('Staff login required.');const seen=new Set(),rows=[];S.orders.forEach(o=>{const c=o.customer||{},phone=String(c.phone||'').trim();if(phone&&!seen.has(phone)){seen.add(phone);rows.push(`${c.name||'Customer'} — ${phone}${c.district?' — '+c.district:''}`)}});nofCopyText(rows.join('\n'),'Customer contacts copied.');}
function ownerFindPriceIssues(){if(!isOwner())return toast('Staff login required.');const rows=S.products.filter(f=>!Number.isFinite(Number(f.price))||Number(f.price)<=0||Number(f.price)>100000).map(f=>`${f.name||'(unnamed)'}: ${f.price}`);alert('PRICE CHECK\n\n'+(rows.join('\n')||'No obvious price issues found.'));}
function ownerFindMissingPhotos(){if(!isOwner())return toast('Staff login required.');const rows=S.products.filter(f=>!f.img).map(f=>`${f.name} (${f.cat||'No category'})`);alert('FURNITURE ITEMS WITHOUT PHOTOS\n\n'+(rows.join('\n')||'All furniture items have image data.'));}
function ownerMenuTextByCategory(){if(!isOwner())return toast('Staff login required.');const text=S.cats.map(c=>c+'\n'+S.products.filter(f=>f.cat===c).map(f=>`• ${f.name} — Rs. ${f.price}${f.avail?'':' (Sold out)'}`).join('\n')).join('\n\n');nofCopyText(text||'No menu categories available.','Category menu copied.');}
function ownerCopyOutOfStockNames(){if(!isOwner())return toast('Staff login required.');nofCopyText(S.products.filter(f=>!f.avail).map(f=>f.name).join('\n'),'Sold-out furniture list copied.');}
function ownerCopyTodayOrderIds(){if(!isOwner())return toast('Staff login required.');const today=new Date().toDateString();nofCopyText(S.orders.filter(o=>new Date(o.created||0).toDateString()===today).map(o=>o.id).join('\n'),'Today’s order IDs copied.');}
function ownerOrderStatusSummary(){if(!isOwner())return toast('Staff login required.');alert('ORDER STATUS SUMMARY\n\n'+STAT.map(st=>st+': '+S.orders.filter(o=>o.status===st).length).join('\n')+'\n\nTotal orders: '+S.orders.length);}
function ownerCopyDeliveryAssignments(){if(!isOwner())return toast('Staff login required.');const rows=S.orders.filter(o=>o.deliveryEmail).map(o=>`${o.id} — ${o.deliveryEmail} — ${o.status||'Pending'}`);nofCopyText(rows.join('\n'),'Delivery assignments copied.');}
function ownerExportLowToHighMenu(){if(!isOwner())return toast('Staff login required.');const rows=[['Product','Category','Price Rs.','Availability'],...S.products.slice().sort((a,b)=>Number(a.price)-Number(b.price)).map(f=>[f.name,f.cat,Number(f.price)||0,f.avail?'Available':'Sold out'])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile('nepali-furniture-menu-price-list.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Price list exported from low to high.');}
function ownerRestoreAvailableConfirm(){if(!isOwner())return toast('Staff login required.');if(!confirm('Mark every furniture item in the selected restaurant as available? Only do this if the items can be ordered now.'))return;bulkAvailability(true);}

function customerCareGuide(){customerHelpSheet('🧽 Furniture care guide',`<b>Wood furniture</b><p>Wipe with a soft dry or slightly damp cloth. Clean spills quickly and avoid soaking the surface.</p><b>Sofas and fabric</b><p>Vacuum gently and test any cleaner on a hidden spot first.</p><b>All furniture</b><p>Keep away from direct heat and long exposure to strong sunlight. Follow the care instructions supplied with your item.`);}
function customerMeasureGuide(){customerHelpSheet('📏 Measure before ordering',`<p>1. Measure the room width and length.</p><p>2. Measure doorways, stairs and lift openings.</p><p>3. Leave walking space around the furniture.</p><p>4. Check the product dimensions with the store before ordering if they are not listed.</p><p><b>Tip:</b> Take a photo of the space and keep your measurements ready when contacting support.</p>`);}
function customerDeliveryGuide(){customerHelpSheet('🛵 Delivery or store pickup',`<p><b>Home delivery:</b> enter your full address and district at checkout. You may share a Google Maps link or use the location button if you choose.</p><p><b>Store pickup:</b> select pickup at checkout if available, then wait for store confirmation before travelling.</p><p>Delivery fee is shown in your cart and checkout. Timing depends on distance, availability and store confirmation.</p>`);}

function customerOrderGuide(){customerHelpSheet('📦 How to place an order',`<p>1. Browse furniture and tap <b>+</b> to add an item.</p><p>2. Open Cart and adjust quantities.</p><p>3. Tap Proceed to checkout.</p><p>4. Enter your name, phone, district and delivery details.</p><p>5. Check the total and tap Place order once.</p><p>6. Open <b>Orders</b> to check the status. If the screen says “Retry order”, check Orders before trying again to avoid a duplicate.</p>`);}
function customerCancelGuide(){customerHelpSheet('↩️ Cancellation and returns',`<p>Open <b>Orders</b> and use the cancellation option if it is available for your order status.</p><p>For a damaged, incorrect or delayed item, contact support with your order number and a short description. Refunds or returns must be confirmed by the store; they are not automatic.</p><p>Support: <a href="tel:${SUPPORT_PHONE}">${SUPPORT_PHONE}</a></p>`);}
function customerCopyAvailableMenu(){const rows=(S.products||[]).filter(f=>f.avail).map(f=>`${f.name} — ${rs(f.price)}${f.cat?' ('+f.cat+')':''}`);nofCopyText('ROYAL NEPAL FURNITURE INDUSTRIES\nAVAILABLE FURNITURE\n\n'+(rows.join('\n')||'No available products listed')+'\n\nContact: '+SUPPORT_PHONE,'Available furniture list copied.');}
function customerShareCartWhatsApp(){const its=cartItems();if(!its.length)return toast('Your cart is empty.');const t=totals(its);const lines=its.map(i=>`${i.f.name} × ${i.q} = ${rs(i.f.price*i.q)}`);const msg=encodeURIComponent('Namaste, I need help with this furniture order:\n'+lines.join('\n')+'\nSubtotal: '+rs(t.sub)+'\nEstimated delivery fee: '+rs(t.fee)+'\nTotal: '+rs(t.total));window.open('https://wa.me/'+String(SUPPORT_PHONE).replace(/\D/g,'')+'?text='+msg,'_blank','noopener');}
function customerPrintWishlist(){const items=(S.wish||[]).map(furniture).filter(Boolean);if(!items.length)return toast('Save furniture with the heart button first.');const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print your saved list.');w.document.write('<!doctype html><html><head><title>Saved Furniture</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px Arial;padding:24px;color:#222}h1{color:#795548}li{padding:8px 0}</style></head><body><h1>Ravi Furniture Store</h1><h2>My saved furniture</h2><ul>'+items.map(f=>'<li>'+esc(f.name)+' — '+rs(f.price)+'</li>').join('')+'</ul><p>Support: '+SUPPORT_PHONE+'</p><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close();}
function customerBudgetCalculator(){const raw=prompt('Enter your planned total budget in Rs.');if(raw===null)return;const budget=Number(raw);if(!Number.isFinite(budget)||budget<1)return toast('Please enter a valid budget.');const items=cartItems(),t=totals(items);const remaining=budget-t.total;alert('BUDGET CHECK\n\nYour cart total: '+rs(t.total)+'\nYour budget: '+rs(budget)+'\n'+(remaining>=0?'Remaining budget: '+rs(remaining):'Over budget by: '+rs(Math.abs(remaining)))+'\n\nThis is an estimate; confirm final charges at checkout.');}
function customerRequestQuote(){const items=(S.wish||[]).map(furniture).filter(Boolean);const text='Namaste, please help me with a furniture quote.\n'+(items.length?items.map(f=>`• ${f.name} — ${rs(f.price)}`).join('\n'):'I would like to ask about furniture options and prices.')+'\nPlease confirm availability and final price.';window.open('https://wa.me/'+String(SUPPORT_PHONE).replace(/\D/g,'')+'?text='+encodeURIComponent(text),'_blank','noopener');}
function customerContactOptions(){sheet(`<div class="row sp"><h2 style="margin:0">Contact the store</h2><button class="btn gray sm" onclick="closeSheet()">Close</button></div><p class="mut">Choose how you would like to contact Ravi Furniture Store.</p><a class="btn" style="text-decoration:none;margin:6px 0" href="tel:${SUPPORT_PHONE}">☎ Call ${SUPPORT_PHONE}</a><button class="btn blue" onclick="closeSheet();customerWhatsAppSupport()">💬 WhatsApp message</button><button class="btn gray" style="margin-top:8px" onclick="customerCopyRestaurantInfo()">📋 Copy store details</button>`);}


function customerCompareTwo(){const names=(S.products||[]).map(f=>f.name);if(names.length<2)return toast('At least two products are needed.');const a=prompt('Type the first furniture name:\n'+names.join('\n'));if(!a)return;const f1=S.products.find(f=>f.name.toLowerCase()===a.trim().toLowerCase())||S.products.find(f=>f.name.toLowerCase().includes(a.trim().toLowerCase()));if(!f1)return toast('First product not found.');const b=prompt('Type the second furniture name:\n'+names.filter(n=>n!==f1.name).join('\n'));if(!b)return;const f2=S.products.find(f=>f.name.toLowerCase()===b.trim().toLowerCase())||S.products.find(f=>f.name.toLowerCase().includes(b.trim().toLowerCase()));if(!f2||f1.id===f2.id)return toast('Choose a different second product.');alert('PRODUCT COMPARISON\n\n'+f1.name+'\nPrice: '+rs(f1.price)+'\nAvailability: '+(f1.avail?'Available':'Sold out')+'\n\n'+f2.name+'\nPrice: '+rs(f2.price)+'\nAvailability: '+(f2.avail?'Available':'Sold out')+'\n\nPrice difference: '+rs(Math.abs(Number(f1.price)-Number(f2.price))));}
function customerRoomFitCheck(){const name=prompt('Furniture name (optional):');if(name===null)return;const w=Number(prompt('Available room width in feet (e.g. 10):'));if(!Number.isFinite(w)||w<=0)return toast('Enter a valid room width.');const l=Number(prompt('Available room length in feet:'));if(!Number.isFinite(l)||l<=0)return toast('Enter a valid room length.');const fw=Number(prompt('Furniture width in feet:'));if(!Number.isFinite(fw)||fw<=0)return toast('Enter a valid furniture width.');const fl=Number(prompt('Furniture length in feet:'));if(!Number.isFinite(fl)||fl<=0)return toast('Enter a valid furniture length.');alert((name||'Furniture')+' room-fit estimate\n\nRoom: '+w+' × '+l+' ft\nFurniture: '+fw+' × '+fl+' ft\n\n'+(fw<=w&&fl<=l?'It fits by basic floor dimensions. Leave extra walking space and check door/stair access.':'It may not fit in this room. Recheck measurements before ordering.'));}

function customerPrintCartQuote(){const its=cartItems();if(!its.length)return toast('Add furniture to your cart first.');const t=totals(its);const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print the quotation.');w.document.write('<!doctype html><html><head><title>Furniture quotation</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px Arial;padding:24px;color:#222}h1{color:#795548}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.total{font-size:20px;font-weight:bold}</style></head><body><h1>Ravi Furniture Store</h1><h2>Cart quotation</h2><p>Estimate only · '+new Date().toLocaleString()+'</p><table><tr><th>Furniture</th><th>Qty</th><th>Amount</th></tr>'+its.map(i=>'<tr><td>'+esc(i.f.name)+'</td><td>'+i.q+'</td><td>'+rs(i.f.price*i.q)+'</td></tr>').join('')+'</table><p>Subtotal: '+rs(t.sub)+'</p><p>Estimated delivery: '+rs(t.fee)+'</p><p class="total">Estimated total: '+rs(t.total)+'</p><p>Final charges and availability must be confirmed by the store.</p><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close();}

function card(f){
  const v=vis(f),w=S.wish.includes(f.id);
  return `<div class="fc"><div class="fv" style="${v.bg}" onclick="detail('${f.id}')">${f.emoji||'🍽️'}${v.img}<button class="heart" onclick="event.stopPropagation();wish('${f.id}')" aria-label="Wishlist">${w?'❤️':'🤍'}</button></div>
  <div class="fb"><h3>${esc(f.name)}</h3><p>${esc(f.desc)}</p><span class="tag ${f.avail?'in':'out'}" style="align-self:flex-start;margin-top:3px">${f.avail?'Available':'Sold out'}</span>
  <div class="fr"><span><span class="price">${rs(f.price)}</span>${f.discount?`<div style="font-size:10px;color:#278052;font-weight:700">${f.discount}% OFF <del style="color:#887b73;font-weight:500">${rs(f.originalPrice)}</del></div>`:``}</span><button class="add" ${f.avail?'':'disabled'} onclick="addCart('${f.id}')" aria-label="Add to cart">+</button></div></div></div>`;
}
function setMenuSearch(value){S.q=String(value||'');const input=$('#q');if(input)input.value=S.q;renderList();}
function rememberSearch(value){const q=String(value||'').trim();if(q.length<2)return;S.recentSearches=[q,...(S.recentSearches||[]).filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,5);DB.set('recentSearches',S.recentSearches);}

async function getDeliveryLocation(){
  const msg=$('#locmsg');
  const showManualHelp=(reason)=>{
    if(msg)msg.innerHTML=esc(reason)+`<br><br>Check that phone Location/GPS is on and allow location permission for this app/browser. GPS requires this website to be opened over HTTPS and the customer must allow location permission. If location is denied, the customer can enter an address or Maps link manually. <button type="button" class="btn blue" style="margin-top:8px" onclick="showMapPreviewFromButton()">🗺️ Show address on map</button><div id="mapPreview"></div><div style="margin-top:6px">You can also enter the delivery address manually.</div>`;
  };
  if(!navigator.geolocation){showManualHelp('Location is not available in this browser. Open the published website over HTTPS and allow location permission, or enter the delivery address manually.');return toast('Location is not supported here');}
  if(!window.isSecureContext && location.protocol!=='file:'){
    showManualHelp('Location access requires HTTPS. Publish this page on an HTTPS website and allow location permission, or enter the delivery address manually.');
    return;
  }
  if(msg)msg.textContent='Requesting location permission…';
  try{
    navigator.geolocation.getCurrentPosition(pos=>{
      S.deliveryLocation={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,capturedAt:Date.now()};
      DB.set('deliveryLocation',S.deliveryLocation);
      const lat=S.deliveryLocation.lat,lng=S.deliveryLocation.lng;
      if(msg)msg.innerHTML='✅ Location captured. <a class="btn blue" style="display:inline-block;margin-top:8px" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+lat+','+lng+'">🗺️ Preview my location</a><div class="mut">Coordinates will be attached to your order.</div>';
      /* Keep coordinates as structured GPS data; do not clutter the address field with a long Maps URL. */
      toast('Delivery location added');
    },err=>{
      console.warn('Geolocation error',err);
      const reasons={1:'Location permission was denied. Allow location permission in your browser settings and try again, or enter the delivery address manually.',2:'Phone could not determine the location. Check GPS and internet.',3:'Location request timed out. Try again outdoors.'};
      showManualHelp(reasons[err&&err.code]||'Could not get your location.');
      toast('Location unavailable — check permission and GPS');
    },{enableHighAccuracy:true,timeout:25000,maximumAge:0});
  }catch(err){console.warn('Geolocation request failed',err);showManualHelp('The app could not start a location request.');}
}

 await ref.update({status:'approved',restaurantId:id,reviewedAt:Date.now(),reviewedBy:AUTH().currentUser.uid});

async function login(){
  const u=$('#au').value.trim(),p=$('#ap').value;
  const err=$('#ae');err.textContent='';
  if(!u||!p){err.textContent='Enter your store owner email and password.';return}
  if(!FIREBASE_ONLINE||!AUTH()){err.textContent='Unable to connect right now. Check your internet connection and try again.';return}
  try{
    const r=await AUTH().signInWithEmailAndPassword(u,p);
    if(r.user.uid===OWNER_UID){S.ownerRestaurantId=null;S.ownerUid=r.user.uid;}
    else{
      const role=await FS().collection('restaurantOwners').doc(r.user.uid).get();
      if(!role.exists||role.data().active===false||!role.data().restaurantId||!['owner','manager',undefined].includes(role.data().role)){await AUTH().signOut();err.textContent='This account is not assigned to an active restaurant. Ask the super admin to assign it.';return;}

    }
    S.adminIn=true;localStorage.setItem('nof_owner_login','1');
    watchAdminOrders();toast(isSuperAdmin()?'Welcome, super admin':isManager()?'Welcome, Furniture Owner':'Welcome, store owner');render();

}

async function deleteRestaurant(id){
  if(!isSuperAdmin())return toast('Super Admin login required.');
  if(id===DEFAULT_RESTAURANT_ID)return toast('The default Ravi Furniture Store restaurant cannot be deleted.');
  const r=RESTAURANTS.find(x=>x.id===id);if(!r)return toast('Restaurant not found.');
  if(!confirm(`Permanently delete "${r.name||'this restaurant'}" from the restaurant directory? This does not automatically delete its orders or furniture records.`))return;
  try{
    if(!FIREBASE_ONLINE||!FS())throw new Error('Connection is unavailable. Please try again.');
    await FS().collection('restaurants').doc(id).delete();

function pickImg(inp){
  if(!isOwner()){if(inp)inp.value='';return toast('Only the authenticated store owner can upload furniture photos.');}
  const file=inp&&inp.files&&inp.files[0];if(!file)return;
  if(!/^image\\//i.test(file.type)){toast('Please choose an image file');inp.value='';return;}
  if(file.size>12*1024*1024){toast('Choose a photo smaller than 12 MB');inp.value='';return;}
  const rd=new FileReader();
  rd.onerror=()=>{toast('Could not read the photo. Try another image.');inp.value='';};
  rd.onload=()=>{
    const im=new Image();
    im.onerror=()=>{toast('Could not open that image. Try JPG or PNG.');inp.value='';};
    im.onload=()=>{
      try{
        const M=640,k=Math.min(1,M/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
        const ctx=c.getContext('2d');if(!ctx)throw new Error('Image editor is unavailable');
        ctx.drawImage(im,0,0,c.width,c.height);
        S.tmpImg=c.toDataURL('image/jpeg',.72);
        const link=$('#fi');if(link)link.value='';
        updPv();toast('Photo ready. Tap Save product to upload it.');
      }catch(e){console.error('Photo processing failed',e);toast('Photo processing failed. Try a smaller JPG image.');}
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(file);
}
async function saveProduct(id){
  if(!isOwner())return toast('Please log in with the registered store owner account before adding or editing furniture.');
  const er=$('#fer'),btn=$('#saveProductBtn');
  const d={name:$('#fn').value.trim(),cat:$('#fc').value,price:Math.round(+$('#fp').value),emoji:$('#fe').value.trim()||'🍽️',desc:$('#fd').value.trim(),img:S.tmpImg||'',avail:$('#fa').checked};
  if(d.name.length<2){if(er)er.textContent='Enter a product name.';return;}
  if(!(d.price>=0)||$('#fp').value===''){if(er)er.textContent='Enter a valid price.';return;}
  if(d.img&&!/^(https?:\/\/|data:image\/)/i.test(d.img)){if(er)er.textContent='Image link must start with http:// or https://';return;}
  if(btn){btn.disabled=true;btn.textContent=d.img.startsWith('data:image/')?'Uploading photo…':'Saving furniture…';}
  const productsBefore=JSON.stringify(S.products);
  try{
    if(d.img.startsWith('data:image/')){
      if(!FIREBASE_ONLINE||!STORAGE())throw new Error('Firebase Storage is unavailable. Check internet and Firebase Storage setup.');
      if(!AUTH()||!AUTH().currentUser||AUTH().currentUser.uid!==OWNER_UID)throw new Error('Owner session expired. Log in again before uploading furniture photos.');
      const path='furniture-images/'+RESTAURANT_ID+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';
      const ref=STORAGE().ref().child(path);
      await ref.putString(d.img,'data_url',{contentType:'image/jpeg'});
      d.img=await ref.getDownloadURL();
    }
    if(!d.desc)d.desc='Please contact Ravi Furniture Store to confirm dimensions, material and finish.';
    const previous=id?{...furniture(id)}:null;
    if(id)Object.assign(furniture(id),d);else S.products.unshift({id:'f'+uid(),...d});
    DB.set('products',S.products);
    if(!FIREBASE_ONLINE||!FS())throw new Error('Firebase is offline; furniture cannot sync to customer devices. Check internet and Firebase configuration.');
    if(!AUTH()||!AUTH().currentUser||AUTH().currentUser.uid!==OWNER_UID)throw new Error('Owner session expired. Log in again before saving furniture.');
    await FS().collection('appState').doc('products').set({value:S.products,updatedAt:Date.now(),updatedBy:AUTH().currentUser.uid,restaurantId:RESTAURANT_ID});
    closeSheet();toast(id?'Product updated and synced':'Product added and synced');render();
  }catch(err){
    // Restore the prior catalog if the cloud write failed, so retrying a new item cannot create duplicates.
    try{S.products=JSON.parse(productsBefore);DB.set('products',S.products);}catch(restoreErr){console.warn('Could not restore local furniture list',restoreErr);}
    console.error('Product save/upload failed',err);
    if(er)er.textContent='Could not save furniture: '+(err.code||err.message||'Check Firebase Storage/Firestore rules and internet.');
    if(btn){btn.disabled=false;btn.textContent='Retry save';}
    // Keep the form open so the owner can retry without re-entering the details.
  }
}

function openSubmittedCustomerMap(event, rawUrl){
  if(event) event.preventDefault();
  let u;
  try { u = new URL(rawUrl); } catch (_) { toast('Customer location link is invalid.'); return false; }
  if(!['https:','http:'].includes(u.protocol)){ toast('Invalid location link. Only HTTP/HTTPS URLs are supported.'); return false; }
  // Open the customer's exact submitted Google Maps URL; Android WebView may handle this via its external browser/app.
  try { window.open(u.href, '_blank'); } catch (_) {}
  // Fallback for WebViews that block popup windows: navigate directly to the submitted Maps link.
  setTimeout(function(){
    try { if(document.visibilityState === 'visible') window.location.href = u.href; } catch (_) {}
  }, 250);
  return false;
}

function renderSubmittedLocationLink(o){
  const raw=String(o&&o.customer&&o.customer.mapsUrl||'').trim();
  if(!raw) return '<br><b>📍 Submitted location URL:</b> <span class="mut">No location link was submitted for this order.</span>';
  let parsed;
  try { parsed=new URL(raw); } catch (_) { return '<br><b>📍 Submitted location URL:</b> <span class="err">The saved location link is invalid.</span>'; }
  if(parsed.protocol!=='https:' && parsed.protocol!=='http:') return '<br><b>📍 Submitted location URL:</b> <span class="err">Invalid location link: only http/https URLs can be opened.</span>';
  return '<div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b>📍 Customer location</b><a class="btn blue sm" style="display:inline-block;width:auto;margin:0" href="'+esc(raw)+'" target="_blank" rel="noopener noreferrer" onclick="return openSubmittedCustomerMap(event,this.href)">🗺️ Open in Google Maps</a></div>';
}

function importLocalBackup(input){if(!isOwner())return toast('Staff login required.');const file=input.files&&input.files[0];if(!file)return;if(file.size>5*1024*1024)return toast('Backup file must be smaller than 5 MB.');const reader=new FileReader();reader.onload=()=>{try{const b=JSON.parse(reader.result);if(b.app!=='Ravi Furniture Store'||!b.data||!Array.isArray(b.data.products)||!Array.isArray(b.data.cats))throw new Error('This is not a valid Ravi Furniture Store backup.');if(!confirm('Restore this backup on this device? Current local catalog and saved data will be replaced.'))return;Object.entries(b.data).forEach(([k,v])=>DB.set(k,v));load();render();toast('Backup restored on this device');}catch(e){toast('Could not restore backup: '+e.message)}};reader.readAsText(file);}
function GenCopySupport(){const t=`Ravi Furniture Store\nContact: ${SUPPORT_PHONE}`;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Support numbers copied')).catch(()=>prompt('Copy these numbers',t));else prompt('Copy these numbers',t);}
function exportCustomersCSV(){if(!isOwner())return toast('Staff login required.');const m=new Map();S.orders.forEach(o=>{const c=o.customer||{},k=String(c.phone||c.email||c.name||o.id);if(!m.has(k))m.set(k,[c.name||'',c.phone||'',c.email||'',c.district||'',c.address||'']);});const rows=[['Customer','Phone','Email','District','Address'],...m.values()];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile('nepali-furniture-customers-from-orders.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Customer CSV exported');}
function exportPendingOrdersCSV(){if(!isOwner())return toast('Staff login required.');const rows=[['Order ID','Date','Customer','Phone','District','Status','Total','Items'],...S.orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).map(o=>[o.id,new Date(o.created||Date.now()).toISOString(),o.customer?.name||'',o.customer?.phone||'',o.customer?.district||'',o.status||'',o.total??'',(o.items||[]).map(i=>`${i.qty} x ${i.name}`).join('; ')])];if(rows.length===1)return toast('No active orders to export');const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile('nepali-furniture-active-orders.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Active orders exported');}
function exportSoldOutCSV(){if(!isOwner())return toast('Staff login required.');const rows=[['Name','Category','Price NPR','Description'],...S.products.filter(f=>!f.avail).map(f=>[f.name,f.cat,f.price,f.desc||''])];if(rows.length===1)return toast('No sold-out items');const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile('nepali-furniture-sold-out.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Sold-out items exported');}
function exportTodayOrdersCSV(){if(!isOwner())return toast('Staff login required.');const today=new Date().toDateString();const list=S.orders.filter(o=>new Date(o.created||0).toDateString()===today);if(!list.length)return toast('No orders recorded today');const rows=[['Order ID','Time','Customer','Phone','Status','Total','Payment'],...list.map(o=>[o.id,new Date(o.created||Date.now()).toLocaleTimeString(),o.customer?.name||'',o.customer?.phone||'',o.status||'',o.total??'',o.payment||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile('nepali-furniture-todays-orders.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Today’s orders exported');}
function printAdminReport(){if(!isOwner())return toast('Staff login required.');const total=S.orders.reduce((n,o)=>n+Number(o.total||0),0),delivered=S.orders.filter(o=>o.status==='Delivered').length,active=S.orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length;const win=window.open('','_blank');if(!win)return toast('Allow pop-ups to print the report');win.document.write('<html><head><title>Ravi Furniture Store Report</title><style>body{font:14px Arial;padding:24px}h1{color:#C8102E}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body><h1>Ravi Furniture Store — Admin Report</h1><p>Generated: '+new Date().toLocaleString()+'</p><table><tr><th>Metric</th><th>Value</th></tr><tr><td>Total orders loaded</td><td>'+S.orders.length+'</td></tr><tr><td>Active orders</td><td>'+active+'</td></tr><tr><td>Delivered orders</td><td>'+delivered+'</td></tr><tr><td>Order value total (all loaded orders)</td><td>Rs. '+total.toFixed(2)+'</td></tr><tr><td>Menu items</td><td>'+S.products.length+'</td></tr><tr><td>Available items</td><td>'+S.products.filter(f=>f.avail).length+'</td></tr><tr><td>Sold out items</td><td>'+S.products.filter(f=>!f.avail).length+'</td></tr></table><p>Note: totals reflect orders currently loaded in this app, not necessarily every historical Firebase order.</p></body></html>');win.document.close();win.focus();win.print();}
function copyMenuText(){if(!isOwner())return toast('Staff login required.');const t='🛋️ Ravi Furniture Store Menu\n'+S.products.map(f=>`${f.avail?'✅':'❌'} ${f.name} — Rs. ${f.price} (${f.cat})`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast('Menu text copied')).catch(()=>prompt('Copy menu text',t));else prompt('Copy menu text',t);}
function shareMenuWhatsApp(){const t='🍽️ *Ravi Furniture Store Menu*\n'+S.products.filter(f=>f.avail).map(f=>`• ${f.name} — Rs. ${f.price}`).join('\n')+'\n\nMessage us to order!';window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener');}
function bulkAvailability(v){if(!isOwner())return toast('Staff login required.');if(!S.products.length)return toast('No menu items found');if(!confirm(v?'Mark ALL menu items available?':'Mark ALL menu items sold out?'))return;S.products.forEach(f=>f.avail=!!v);save('products');render();toast(v?'All items marked available':'All items marked sold out');}
function reportDuplicateProducts(){const m={};S.products.forEach(f=>{const k=String(f.name||'').trim().toLowerCase();if(k)(m[k]||(m[k]=[])).push(f.name)});const d=Object.entries(m).filter(([k,a])=>a.length>1).map(([k,a])=>a[0]+' ('+a.length+')');alert(d.length?'Possible duplicate product names:\n\n'+d.join('\n'):'No duplicate product names found.');}
function showOrderInsights(){const active=S.orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length,del=S.orders.filter(o=>o.status==='Delivered').length,cancel=S.orders.filter(o=>o.status==='Cancelled').length,rev=S.orders.reduce((n,o)=>n+Number(o.total||0),0),avg=S.orders.length?rev/S.orders.length:0;alert('ORDER INSIGHTS\n\nAll loaded orders: '+S.orders.length+'\nActive: '+active+'\nDelivered: '+del+'\nCancelled: '+cancel+'\nTotal order value: Rs. '+rev.toFixed(2)+'\nAverage order value: Rs. '+avg.toFixed(2));}
function showCategoryReport(){const m={};S.products.forEach(f=>{const k=f.cat||'Uncategorised';m[k]=(m[k]||0)+1});const out=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+': '+v+' item(s)');alert('MENU BY CATEGORY\n\n'+(out.join('\n')||'No categories/items'));}
function showPaymentReport(){const m={};S.orders.forEach(o=>{const k=o.payment||'Not specified';m[k]=(m[k]||0)+1});alert('PAYMENT METHODS\n\n'+(Object.entries(m).map(([k,v])=>k+': '+v+' order(s)').join('\n')||'No orders loaded'));}
function showFulfilmentReport(){const m={};S.orders.forEach(o=>{const k=o.fulfillmentMode==='pickup'?'Store pickup':'Delivery';m[k]=(m[k]||0)+1});alert('FULFILMENT SUMMARY\n\n'+(Object.entries(m).map(([k,v])=>k+': '+v+' order(s)').join('\n')||'No orders loaded'));}
function showTopSellingProducts(){const m={};S.orders.forEach(o=>(o.items||[]).forEach(i=>{const k=String(i.name||'Unknown');m[k]=(m[k]||0)+Number(i.qty||1)}));const out=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10).map((x,i)=>(i+1)+'. '+x[0]+' — '+x[1]+' sold');alert('TOP FOOD ITEMS (from loaded orders)\n\n'+(out.join('\n')||'No item-level order data available'));}
function showMenuValidation(){const issues=[];S.products.forEach(f=>{if(!String(f.name||'').trim())issues.push('Product with missing name (ID '+f.id+')');if(!(Number(f.price)>0))issues.push((f.name||f.id)+': price is zero or invalid');if(!String(f.desc||'').trim())issues.push((f.name||f.id)+': missing description');if(!String(f.cat||'').trim())issues.push((f.name||f.id)+': missing category');});alert('MENU VALIDATION\n\n'+(issues.length?issues.slice(0,80).join('\n')+(issues.length>80?'\n…more issues':''):'No obvious menu data issues found.'));}

function aTools(){return `<div class="card"><h3>🧰 Useful Admin Tools</h3><p class="mut">Export reports and keep a local backup before major changes.</p><button class="btn" onclick="exportOrdersCSV()">📥 Export orders to CSV</button><button class="btn blue" style="margin-top:8px" onclick="exportMenuCSV()">🍽️ Export menu to CSV</button><button class="btn alt" style="margin-top:8px" onclick="exportLocalBackup()">💾 Download app data backup</button><label class="f" for="backupImport">Restore local backup JSON</label><input class="fi" id="backupImport" type="file" accept=".json,application/json" onchange="importLocalBackup(this)"><div class="mut" style="margin-top:10px">CSV opens in Excel or Google Sheets. Backup/restore works on this device's stored app data, not as a Firebase database backup. Keep backup files private because orders may contain customer information.</div></div><div class="card"><h3>📞 Quick Support</h3><div class="row"><a class="btn sm" style="text-decoration:none" href="tel:${SUPPORT_PHONE}">Call support</a></div><button class="btn gray" style="margin-top:8px" onclick="GenCopySupport()">Copy support numbers</button></div><div class="card"><h3>🚀 More useful tools</h3><p class="mut">Extra reports and quick actions for day-to-day restaurant operations.</p><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px"><button class="btn blue" onclick="exportCustomersCSV()">👥 Export customers</button><button class="btn blue" onclick="exportPendingOrdersCSV()">📦 Export active orders</button><button class="btn alt" onclick="exportTodayOrdersCSV()">📅 Export today’s orders</button><button class="btn alt" onclick="exportDeliveredCSV()">✅ Export delivered</button><button class="btn gray" onclick="exportSoldOutCSV()">🚫 Export sold-out products</button><button class="btn gray" onclick="exportCategoryCSV()">🏷️ Category CSV</button><button class="btn" onclick="printAdminReport()">🖨️ Print admin report</button><button class="btn" onclick="copyMenuText()">📋 Copy menu text</button><button class="btn blue" onclick="shareMenuWhatsApp()">💬 Share menu on WhatsApp</button><button class="btn alt" onclick="bulkAvailability(true)">✅ Mark all available</button><button class="btn danger" onclick="bulkAvailability(false)">⛔ Mark all sold out</button><button class="btn gray" onclick="reportDuplicateProducts()">🔍 Find duplicate products</button><button class="btn gray" onclick="showOrderInsights()">📈 Order insights</button><button class="btn gray" onclick="showDailySummary()">🌞 Today’s summary</button><button class="btn gray" onclick="showTopSellingProducts()">🏆 Top-selling products</button><button class="btn gray" onclick="showCategoryReport()">📊 Category report</button><button class="btn gray" onclick="showPaymentReport()">💳 Payment report</button><button class="btn gray" onclick="showFulfilmentReport()">🛵 Delivery/pickup report</button><button class="btn gray" onclick="showDistrictReport()">🗺️ District report</button><button class="btn gray" onclick="showMenuValidation()">🩺 Validate menu data</button><button class="btn gray" onclick="copyActiveOrderIds()">🧾 Copy active order IDs</button><button class="btn danger" onclick="clearAdminLocalCart()">🧹 Clear this device’s cart</button><button class="btn gray" onclick="clearRecentlyViewed()">👀 Clear recently viewed</button><button class="btn gray" onclick="resetMenuSearchTools()">🧽 Clear search/view history</button></div><p class="mut" style="margin-top:10px">Reports use the orders and menu currently loaded in this app. Customer export is derived from order records; it is not a complete customer database. Bulk availability changes apply to every furniture item in the this store.</p></div><div class="card"><h3>🏪 Restaurant owner quick tools</h3><p class="mut">Fast actions for menu and daily order handling.</p><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px"><button class="btn blue" onclick="ownerCopyPendingSummary()">📥 Copy pending summary</button><button class="btn alt" onclick="ownerExportRevenueReport()">💵 Revenue CSV</button><button class="btn gray" onclick="ownerCopyCustomerContacts()">📞 Copy customer contacts</button><button class="btn gray" onclick="ownerFindPriceIssues()">🔎 Check prices</button><button class="btn gray" onclick="ownerFindMissingPhotos()">🖼️ Missing photos</button><button class="btn gray" onclick="ownerMenuTextByCategory()">🏷️ Menu by category</button><button class="btn alt" onclick="ownerCopyOutOfStockNames()">🚫 Copy sold-out list</button><button class="btn gray" onclick="ownerCopyTodayOrderIds()">📅 Today’s order IDs</button><button class="btn gray" onclick="ownerOrderStatusSummary()">📊 Status summary</button><button class="btn gray" onclick="ownerCopyDeliveryAssignments()">🛵 Delivery assignments</button><button class="btn gray" onclick="ownerExportLowToHighMenu()">📉 Menu price list</button><button class="btn danger" onclick="ownerRestoreAvailableConfirm()">✅ Restore availability</button></div><p class="mut" style="margin-top:10px">Reports use data currently loaded in this app. Contact details are sensitive; copy or export only when needed for order fulfilment.</p></div><div class="card"><h3>📊 Menu health check</h3><div class="row sp"><span>Total menu items</span><b>${S.products.length}</b></div><div class="row sp"><span>Available</span><b>${S.products.filter(f=>f.avail).length}</b></div><div class="row sp"><span>Sold out</span><b>${S.products.filter(f=>!f.avail).length}</b></div><div class="row sp"><span>Categories</span><b>${S.cats.length}</b></div><div class="row sp"><span>Items missing descriptions</span><b>${S.products.filter(f=>!String(f.desc||'').trim()).length}</b></div><div class="row sp"><span>Items with zero/invalid price</span><b>${S.products.filter(f=>!(Number(f.price)>0)).length}</b></div></div>`;}
function aOrders(){
  if(isOwner() && !adminOrdersUnsub) watchAdminOrders();
  const osq=String(S.orderSearch||'').trim().toLowerCase();const r=S.orders.filter(o=>(S.of==='All'||o.status===S.of)&&(!osq||[o.id,o.customer?.name,o.customer?.phone,o.customer?.district,o.restaurantName].some(v=>String(v||'').toLowerCase().includes(osq))));
  const districtCounts={};S.orders.forEach(o=>{const d=String(o.customer&&o.customer.district||'').trim();if(d)districtCounts[d]=(districtCounts[d]||0)+1;});

  <div style="margin:10px 0;padding:10px;background:#f6f7fb;border-radius:12px"><b>👤 ${esc(o.customer.name||'Customer')}</b>${o.customer.district?`<br>🗺️ Customer district: <b>${esc(o.customer.district)}</b>`:''}<br>📞 <a href="tel:${esc(o.customer.phone||'')}">${esc(o.customer.phone||'Not provided')}</a>${o.customer.address&&!/^https?:\/\//i.test(String(o.customer.address).trim())?`<br>🏠 Delivery address: ${esc(o.customer.address)}`:''}<br>🏪 Store: ${esc(o.restaurantName||'Ravi Furniture Store')}<br>🚚 Fulfilment: ${o.fulfillmentMode==='pickup'?'Store pickup':'Delivery'}${o.customer.note?`<br>📝 Order note: ${esc(o.customer.note)}`:''}${renderSubmittedLocationLink(o)}${o.customer.location&&Number.isFinite(Number(o.customer.location.lat))&&Number.isFinite(Number(o.customer.location.lng))?`<br>📌 GPS coordinates: ${esc(o.customer.location.lat)}, ${esc(o.customer.location.lng)}`:''}</div>
  ${o.items.map(x=>`<div class="row sp"><span>${x.qty} × ${esc(x.name)}</span><span>${rs(x.price*x.qty)}</span></div>`).join('')}
  ${Number.isFinite(Number(o.sub))?`<div class="row sp"><span>Subtotal</span><span>${rs(o.sub)}</span></div>`:''}${Number.isFinite(Number(o.fee))&&Number(o.fee)>0?`<div class="row sp"><span>Delivery fee</span><span>${rs(o.fee)}</span></div>`:''}
  <div class="row sp" style="margin:8px 0"><b>Total</b><b class="price">${rs(o.total)}</b></div><div class="card" style="background:#f6f7fb"><b>💵 Cash on Delivery</b><div class="mut">Cash due when the furniture is delivered.</div></div>
  ${o.fulfillmentMode!=='pickup'?`<div class="card" style="background:#f6f7fb;margin-top:10px"><b>🛵 Assign delivery person</b><label class="f">Delivery person's email</label><input class="fi" id="deliveryAssign_${o.id}" type="email" placeholder="delivery@example.com" value="${esc(o.deliveryEmail||'')}"><button class="btn alt sm" style="margin-top:8px" onclick="assignDeliveryEmail('${o.id}')">Save delivery assignment</button><div class="mut" style="margin-top:6px">Only the delivery person signed in with this email can see the assigned order. The delivery person does not need to enter an order code.</div></div>`:''}<div class="mut" style="margin:8px 0 4px">Delivery steps: accept order → prepare furniture → out for delivery → delivered. Use the status control below to update the customer.</div><div class="row"><select class="fi" style="padding:9px" onchange="setStatus('${o.id}',this.value)">${STAT.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
  ${i<4?`<button class="btn blue sm" style="white-space:nowrap" onclick="setStatus('${o.id}','${STAT[i+1]}')">Next ›</button>`:''}</div></div>`}).join(''):empty('🧾','No orders here','Orders with this status will appear in this list.')}`;
}
async function assignDeliveryEmail(id){if(!isOwner()||(!isManager()&&!isSuperAdmin()&&!S.ownerRestaurantId))return toast('Authorized staff login required.');const email=($('#deliveryAssign_'+id)?.value||'').trim().toLowerCase();if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast("Enter a valid delivery person's email.");try{const o=S.orders.find(x=>x.id===id);if(!o)throw new Error('Order not found in this panel.');if(!FIREBASE_ONLINE||!FS())throw new Error('Firebase unavailable.');await FS().collection('orders').doc(id).update({deliveryEmail:email,deliveryAssignedAt:Date.now(),deliveryAssignedBy:AUTH().currentUser.uid});o.deliveryEmail=email;DB.set('orders',S.orders);toast('Delivery person assigned to '+email);render();}catch(e){toast('Assignment failed: '+(e.code||e.message));}}

function aSet(){
  const cod=codEnabled();
  return `  <div class="card"><b>Cash on Delivery</b><p class="mut">Hide COD temporarily when you do not want to accept cash orders. You can enable it again any time.</p><div class="row sp"><span>Customer checkout</span><b>${cod?'Visible':'Hidden'}</b></div><button class="btn ${cod?'gray':'blue'}" style="margin-top:8px" onclick="toggleCODAvailability(${!cod})">${cod?'Hide Cash on Delivery':'Enable Cash on Delivery'}</button></div>
  <div class="card"><b>Store owner account</b><p class="mut">Only the authorized store owner can manage this shop.</p></div>
  <div class="card"><b>Customer orders</b><p class="mut">Order details are available to the authorized store owner for order processing and delivery.</p></div>
  <button class="btn gray" onclick="logout()">Log out</button>`;
}
function resetAll(){
  if(!confirm('This deletes all products, orders, customers and carts on this device. Continue?'))return;
  Object.keys(localStorage).filter(k=>k.startsWith('nof_')).forEach(k=>localStorage.removeItem(k));
  try{sessionStorage.clear()}catch(e){}load();toast('App reset');render();
}


/* ---------- Firebase auth persistence + faster customer startup ---------- */
let authStateReady=false;
function startAuthStateListener(){
  if(!FIREBASE_ONLINE||!AUTH())return;
  AUTH().onAuthStateChanged(async user=>{
    authStateReady=true;
    if(user && user.uid===OWNER_UID){
      S.ownerUid=user.uid;S.ownerRestaurantId=null;S.adminIn=true;
      localStorage.setItem('nof_owner_login','1');watchAdminOrders();if(S.view==='admin')render();return;
    }

    // Show the customer view immediately. Do not make customers wait for the
    // separate restaurantOwners role lookup to finish before rendering.
    if(user && !user.isAnonymous){
      S.adminIn=false;S.staffRole=null;S.ownerRestaurantId=null;S.ownerUid=null;
      if(user.email)S.customer={...(S.customer||{}),email:user.email};
      DB.set('customer',S.customer);
      watchCustomerOrders();
      if(S.view==='account')S.view='home';
      render();

      // Check staff/owner role in the background; this is not on the customer
      // login critical path.
      try{
        const role=await FS().collection('restaurantOwners').doc(user.uid).get();
        if(role.exists&&role.data().active!==false&&role.data().restaurantId&&['owner','manager',undefined].includes(role.data().role)){
          S.staffRole=role.data().role==='manager'?'manager':'owner';
          S.ownerUid=user.uid;S.ownerRestaurantId=role.data().restaurantId;
          RESTAURANT_ID=S.ownerRestaurantId;
          localStorage.setItem('nof_selected_restaurant',RESTAURANT_ID);
          S.adminIn=true;
          await loadCloudCatalog();syncCatalog();watchAdminOrders();
          if(S.view==='admin')render();
        }
      }catch(e){console.warn('Background owner role lookup failed',e)}
      return;
    }
    S.adminIn=false;S.staffRole=null;S.ownerRestaurantId=null;S.ownerUid=null;
    if(S.view!=='admin'){S.view='home';}
    render();
  });
}

/* ---------- Start ---------- */
function init(){
  const R=$('#root');
  $('#layer').innerHTML=`<div class="splash" id="spl"><div class="lg">🛋️</div><h1>Ravi Furniture Store</h1><small>Shop directly with our store</small><div class="ld"><i></i></div><small style="position:absolute;bottom:24px">Built by Niraj Xettri</small></div>`;
  setTimeout(async()=>{
    try{
      if(!window.localStorage)throw new Error('Storage unavailable');
      load();
      FEE=Number(DB.get('deliveryFee',500));if(!Number.isFinite(FEE)||FEE<0)FEE=500;
      // Customers can browse immediately; name and phone are collected at checkout.
      S.view='home';
      render();
      if(FIREBASE_ONLINE&&AUTH()){
        startAuthStateListener();
        if(isOwner())watchAdminOrders();
      }
      syncCatalog();
      loadRestaurants();
      loadCloudCatalog();
      loadCodSetting();
      loadDeliveryFee();
      history.replaceState({root:1},'');history.pushState({v:'home'},'');
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
      const s=$('#spl');if(s){s.style.opacity=0;setTimeout(()=>{if($('#spl'))$('#layer').innerHTML=''},400)}
    }catch(e){
      console.error(e);$('#layer').innerHTML='';R.innerHTML=header('Something went wrong')+`<main>${empty('⚠️','Could not start the app',esc(e.message||'Unknown error'),`<br><button class="btn sm" onclick="init()">Retry</button>`)}</main>`;
    }
  },500);
}
// Live sync across tabs (simulates real-time backend): customer sees status changes made by admin
window.addEventListener('storage',e=>{
  if(!e.key||!e.key.startsWith('nof_')||!S.products)return;
  S.products=DB.get('products',S.products);S.cats=DB.get('cats',S.cats);S.orders=DB.get('orders',S.orders);
  if(!$('#layer').innerHTML&&!['checkout'].includes(S.view)&&document.activeElement.tagName!=='INPUT')render();
});
init();
</script>

<script>
/* Use a standard HTTPS Maps URL rather than an intent:// URL in Android WebView. */
document.addEventListener('click', function (event) {
  const a = event.target && event.target.closest ? event.target.closest('a[href]') : null;
  if (!a) return;
  let u;
  try { u = new URL(a.href, location.href); } catch (_) { return; }
  if (u.protocol === 'https:' &&
      (u.hostname === 'maps.google.com' || u.hostname === 'www.google.com' ||
       u.hostname === 'google.com' || u.hostname.endsWith('.google.com')) &&
      /maps|\?q=/.test(u.pathname + u.search)) {
    event.preventDefault();
    const q = u.searchParams.get('q') || u.searchParams.get('query') ||
              u.searchParams.get('destination') || u.pathname;
    location.href = 'https://maps.google.com/?q=' + encodeURIComponent(q);
  }
}, true);
</script>


<script>
function copyCustomerMapLink() {
  const el = document.getElementById('cmap');
  const value = (el && el.value || '').trim();
  if (!value) {
    alert('Please paste the Google Maps share link first.');
    return;
  }
  if (!/^https:\/\//i.test(value)) {
    alert('Please use a Google Maps link beginning with https://');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(
      () => alert('Maps link copied. Open Chrome and paste it in the address bar.'),
      () => fallbackCopyMapsLink(el, value)
    );
  } else {
    fallbackCopyMapsLink(el, value);
  }
}
function fallbackCopyMapsLink(el, value) {
  el.focus();
  el.select();
  try {
    const ok = document.execCommand('copy');
    alert(ok ? 'Maps link copied. Open Chrome and paste it in the address bar.' : 'Select and copy the link, then paste it into Chrome.');
  } catch (_) {
    alert('Select and copy the link, then paste it into Chrome.');
  }
}
</script>
